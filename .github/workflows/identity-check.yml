name: Identity check

# The pre-push hook is the fast guard, but it lives on one machine and any
# --no-verify walks past it. This runs on GitHub instead, so a commit carrying
# the wrong name cannot sit unnoticed on the default branch, where it would
# poison the contributors list for hours.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On a pull request, checkout defaults to the merge ref, whose tip is
          # a commit GitHub makes and commits as itself. Checking that would
          # fail every PR on a commit nobody wrote, which with this check
          # required on main leaves no way to land anything at all. The head
          # commit and its history are the ones actually being merged, and
          # those are the ones worth checking.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Every commit must carry the brand identity
        run: |
          BRAND_EMAIL='312091367+powerplugins-dev@users.noreply.github.com'
          BRAND_NAME='Power Plugins'
          fail=0

          while IFS='|' read -r sha an ae cn ce parents; do
            # Clicking Merge on a pull request produces a commit that GitHub
            # signs as itself, and no setting changes that. It is the button
            # rather than a contribution, and refusing it would mean no pull
            # request could ever land on a branch where this check is required.
            # Only its committer is excused: the author is still the brand and
            # is still checked, and the exemption is narrow enough that an
            # ordinary commit cannot claim it, since it needs two parents and
            # GitHub's own committer identity at once.
            # written as plain ifs rather than `test && x`, because the job
            # runs under bash -e and a bare failing test is a trap worth not
            # setting for whoever edits this next
            excuse_committer=0
            case "$parents" in
              *\ *)
                if [ "$cn" = "GitHub" ] && [ "$ce" = "noreply@github.com" ]; then
                  excuse_committer=1
                fi
                ;;
            esac
            bad=0
            if [ "$ae" != "$BRAND_EMAIL" ] || [ "$an" != "$BRAND_NAME" ]; then
              bad=1
            fi
            if [ "$excuse_committer" -eq 0 ]; then
              if [ "$ce" != "$BRAND_EMAIL" ] || [ "$cn" != "$BRAND_NAME" ]; then
                bad=1
              fi
            fi
            if [ "$bad" -ne 0 ]; then
              echo "::error::$sha  author=$an <$ae>  committer=$cn <$ce>"
              fail=1
            fi
          done < <(git log --format='%H|%an|%ae|%cn|%ce|%P')

          if git log --format='%B' | grep -qi '^co-authored-by:'; then
            echo "::error::a Co-Authored-By trailer is present in the history"
            git log --format='%H %s' --grep='co-authored-by' -i
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Rewrite the offending commits before this reaches anyone."
            exit 1
          fi
          echo "OK: every commit is authored and committed by $BRAND_NAME."
